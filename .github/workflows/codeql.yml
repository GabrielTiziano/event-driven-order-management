name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan, Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          queries: security-extended

      - name: Compile modules (manual build)
        run: |
          set -e
          for module in microservice-clientes microservice-produtos microservice-pedidos servicos; do
            echo "::group::Compiling $module"
            if [ -x "$module/mvnw" ]; then
              (cd "$module" && ./mvnw --batch-mode --no-transfer-progress -DskipTests compile)
            else
              (cd "$module" && mvn --batch-mode --no-transfer-progress -DskipTests compile)
            fi
            echo "::endgroup::"
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
